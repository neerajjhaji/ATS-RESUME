name: Nightly agent run

# Runs the full agent unattended (plan-light: fetch -> self-critique tailor ->
# gate -> rank) and emails a ranked application kit, by calling the deployed
# /api/agent/run route.
#
# Repo secrets to set:
#   APP_URL      your deployed base URL (e.g. https://your-app.vercel.app)
#   CRON_SECRET  must match the app's CRON_SECRET env
#   DIGEST_BODY  JSON, e.g.
#     {"resumeText":"<your full resume text>","keywords":"Backend Engineer Go",
#      "locations":["Navi Mumbai","Mumbai","Remote"],"minScore":75,"maxTailor":4,
#      "email":"you@email.com"}
# The app must also have RESEND_API_KEY + DIGEST_FROM set for the email to send.
#
# Prefer a lighter listing-only email? Point the curl at /api/agent/digest instead.

on:
  schedule:
    - cron: "30 3 * * 1-5" # 09:00 IST, weekdays
  workflow_dispatch: {}

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger agent run + email kit
        run: |
          curl -fsS -X POST "$APP_URL/api/agent/run" \
            -H "Content-Type: application/json" \
            -H "x-cron-secret: $CRON_SECRET" \
            -d "$DIGEST_BODY"
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          DIGEST_BODY: ${{ secrets.DIGEST_BODY }}
